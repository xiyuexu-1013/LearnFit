<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 220px; padding: 16px; background: #0b1120; color: #fff; font-family: sans-serif; text-align: center; }
        .title { font-weight: bold; color: #06b6d4; font-size: 16px; margin-bottom: 8px; }
        .score { font-size: 40px; font-weight: 900; color: #10b981; margin: 12px 0; }
        .btn { width: 100%; padding: 10px; background: #3b82f6; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="title">🧠 LearnFit AI</div>
    <div class="score" id="score">--</div>
    <div id="status" style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">Browser Focus Tracker</div>
    <button class="btn" id="toggle-btn">Start Session</button>
    <script src="popup.js"></script>
</body>
</html>
